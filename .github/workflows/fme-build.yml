# FME-CAD: build ban Windows (va Linux) de tai ve tu tab Actions. Chay tay hoac khi day tag fme-v*.
name: FME build

on:
  workflow_dispatch:
  push:
    tags: ["fme-v*"]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p cadcraft
      - name: Dong goi
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/cadcraft.exe dist/FME-CAD.exe
          Copy-Item LICENSE-MIT,LICENSE-APACHE,NOTICE dist/
      - uses: actions/upload-artifact@v7
        with:
          name: FME-CAD-windows-x64
          path: dist/
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgtk-3-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p cadcraft
      - run: mkdir -p dist && cp target/release/cadcraft dist/fme-cad && cp LICENSE-MIT LICENSE-APACHE NOTICE dist/
      - uses: actions/upload-artifact@v7
        with:
          name: FME-CAD-linux-x64
          path: dist/
